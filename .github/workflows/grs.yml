name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 기본 GITHUB_TOKEN은 기여 내역을 못 읽는다 → GRS_TOKEN(PAT) 시크릿 필요. 실패하면 기존 카드 유지.
      - name: Generate stats card
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=radical&langs_count=6&exclude_repo=community-platform,devsecops,clawd-code&disable_animations=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # 오류 카드가 나오면 커밋하지 않고 이전 카드 유지
          for f in profile/*.svg; do
            grep -qE 'Something went wrong|not accessible|rate limit' "$f" && git checkout -- "$f"
          done
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
